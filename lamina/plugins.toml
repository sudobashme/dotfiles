# Zsh plugins required by dotfiles zsh/rc.d
# Synced by: lamina sync-plugins (also runs during lamina deploy)

[plugins]
root = "~/.zsh/plugins"

# Plain file used by zsh-abbr (not a git repo)
[[plugins.files]]
path = "~/.zsh/plugins/abbreviations-store"
mode = "touch"

[[plugins.repo]]
name = "abbr"
dir = "abbr"
url = "https://github.com/olets/zsh-abbr.git"
depth = 1
branch = "v6"
recurse_submodules = true

[[plugins.repo]]
name = "autopair"
dir = "autopair"
url = "https://github.com/hlissner/zsh-autopair.git"
depth = 1

[[plugins.repo]]
name = "autosuggestions"
dir = "autosuggestions"
url = "https://github.com/zsh-users/zsh-autosuggestions.git"
depth = 1

[[plugins.repo]]
name = "autosuggestions-abbreviations-strategy"
dir = "autosuggestions-abbreviations-strategy"
url = "https://github.com/olets/zsh-autosuggestions-abbreviations-strategy.git"
depth = 1
branch = "main"

[[plugins.repo]]
name = "completions"
dir = "completions"
url = "https://github.com/zsh-users/zsh-completions.git"
depth = 1

[[plugins.repo]]
