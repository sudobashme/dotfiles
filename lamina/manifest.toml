# Lamina manifest — Personal OS Layer desired state
# Symlinks are applied via dotter (.dotter/global.toml).
# Aspirational desired-state metadata. Today: health.zsh hardcodes checks;
# keep manifest and health.zsh in sync when editing either.

[meta]
name = "lamina"
version = "0.1.0"
description = "Personal OS Layer deploy and health CLI"

[symlinks]
provider = "dotter"
config = ".dotter/global.toml"
# Policy: directory symlinks for pure config trees; per-file for btop/lnav
# (apps that write logs/state into ~/.config/<app>/). See .dotter/global.toml.

# Dual-link: zsh/.zshenv also targets ZDOTDIR (see lamina/deploy.zsh)
dual_link = "zsh/.zshenv"

[plugins]
zsh = "lamina/plugins.toml"
sync_hook = "lamina/hooks/sync-plugins.zsh"

[vault]
engine = "restic"
transport = "rclone"
config = "~/.config/lamina/vault.zsh"
docs = "docs/personal-os-layer/AI-STATE-RECOVERY.md"

[vault.retention]
daily = 7
weekly = 8
monthly = 12
yearly = 3

[health.stray_files]
"~/.zshrc" = "Installer stray; real config lives in ZDOTDIR (~/.zsh)"

[health.stale_paths]
"~/.zsh/plugins/powerlevel10k" = "Removed from stack; starship is the prompt now"
"~/.zsh/plugins/archive" = "Legacy broken URL; not used in rc.d"
"~/.zsh/plugins/iterm2-shell-integration" = "Not referenced in rc.d"
"~/.zsh/plugins/autocomplete" = "Deliberately disabled in rc.d/600_autosuggest.zsh"
"~/.zsh/plugins/zsh-zoxide" = "Redundant; zoxide init runs directly in zsh/.zshrc"
"~/.colima" = "Removed colima; Tart (lamina vm-test) is the VM stack"
"~/.lima" = "Removed lima; Tart (lamina vm-test) is the VM stack"

[health.required_bins]
launch-os-layer = "~/.local/bin/launch-os-layer"
grok-acp = "~/.local/bin/grok-acp"
lamina = "~/.local/bin/lamina"
